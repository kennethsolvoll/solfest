<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #e0e1dd;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 2px solid #4682b4;
            border-radius: 10px;
            background: #fff;
            max-width: 98vw;
            height: auto;
        }
      </style>

</head>
<body>

<canvas id="gameCanvas" width="480" height="320"></canvas>

<script>
const BASE_WIDTH = 480;
const BASE_HEIGHT = 320;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let ballRadius = 10;
let x = canvas.width / 2;
let y = canvas.height - 30;
let dx = 180; // pixels per second (not per frame!)
let dy = -180;

let paddleHeight = 10;
let paddleWidth = 75;
let paddleX = (canvas.width - paddleWidth) / 2;

let rightPressed = false;
let leftPressed = false;

let score = 0;
let highScore = localStorage.getItem("highScore") ? parseInt(localStorage.getItem("highScore")) : 0;

let speedIncreaseInterval = 5000; // ms
let doublePointsTime = 30000; // ms
let pointsMultiplier = 1;
let lastTime = null;

// Responsive canvas setup
function resizeCanvas() {
    const canvas = document.getElementById("gameCanvas");
    let width = Math.min(window.innerWidth * 0.98, BASE_WIDTH);
    let height = width * (BASE_HEIGHT / BASE_WIDTH);
    if (height > window.innerHeight * 0.7) {
        height = window.innerHeight * 0.7;
        width = height * (BASE_WIDTH / BASE_HEIGHT);
    }
    canvas.width = width;
    canvas.height = height;
    updateSizes();
    resetPositions();
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Responsive paddle and ball
function updateSizes() {
    paddleWidth = canvas.width * 0.18;
    paddleHeight = canvas.height * 0.03;
    ballRadius = Math.max(8, canvas.width * 0.02);
    if (paddleX + paddleWidth > canvas.width) {
        paddleX = canvas.width - paddleWidth;
    }
}
updateSizes();
window.addEventListener('resize', updateSizes);

function resetPositions() {
    x = canvas.width / 2;
    y = canvas.height - 30;
    paddleX = (canvas.width - paddleWidth) / 2;
}

// Keyboard controls
document.addEventListener("keydown", keyDownHandler, false);
document.addEventListener("keyup", keyUpHandler, false);

function keyDownHandler(e) {
    if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
    else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
}
function keyUpHandler(e) {
    if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
    else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
}

// Touch controls
canvas.addEventListener("touchstart", handleTouch, false);
canvas.addEventListener("touchmove", handleTouch, false);
function handleTouch(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const touchX = touch.clientX - rect.left;
    // Center paddle on touch
    paddleX = touchX - paddleWidth / 2;
    // Clamp
    if (paddleX < 0) paddleX = 0;
    if (paddleX + paddleWidth > canvas.width) paddleX = canvas.width - paddleWidth;
}

// Drawing functions
function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();
}
function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();
}
function drawScore() {
    ctx.font = `${Math.floor(canvas.height/16)}px Arial`;
    ctx.fillStyle = "#0095DD";
    ctx.fillText("Score: " + score, 8, 20);
}
function drawHighScore() {
    ctx.font = `${Math.floor(canvas.height/16)}px Arial`;
    ctx.fillStyle = "#0095DD";
    const text = "High Score: " + highScore;
    const padding = 12;
    const textWidth = ctx.measureText(text).width;
    ctx.fillText(text, canvas.width - textWidth - padding, 20);
}

// Game logic
function detectCollision() {
    // Wall collisions
    if (x + dx * dt < ballRadius) {
        x = ballRadius;
        dx = -dx;
    } else if (x + dx * dt > canvas.width - ballRadius) {
        x = canvas.width - ballRadius;
        dx = -dx;
    }
    if (y + dy * dt < ballRadius) {
        y = ballRadius;
        dy = -dy;
    }

    // Paddle collision
    const nextY = y + dy * dt;
    const prevY = y;
    const paddleY = canvas.height - ballRadius;
    if (
        // Ball crosses the paddle line this frame
        prevY <= paddleY && nextY >= paddleY &&
        // Ball is horizontally over the paddle
        x > paddleX && x < paddleX + paddleWidth
    ) {
        // ...bounce logic as before...
        const hitPos = ((x - paddleX) - paddleWidth / 2) / (paddleWidth / 2);
        const maxBounce = Math.PI / 3;
        let bounceAngle = hitPos * maxBounce;
        if (Math.abs(bounceAngle) < 0.05) {
            bounceAngle += (Math.random() - 0.5) * 0.2;
        }
        const speed = Math.sqrt(dx * dx + dy * dy);
        dx = speed * Math.sin(bounceAngle);
        dy = -Math.abs(speed * Math.cos(bounceAngle));
        score += 1 * pointsMultiplier;
    } else if (nextY > canvas.height - ballRadius) {
        // Missed paddle: game over
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("highScore", highScore);
        }
        pointsMultiplier = 1;
        document.location.reload();
    }
}
function movePaddle(dt) {
    const paddleSpeed = canvas.width * 1.2; // pixels per second
    if (rightPressed && paddleX < canvas.width - paddleWidth) {
        paddleX += paddleSpeed * dt;
        if (paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
    } else if (leftPressed && paddleX > 0) {
        paddleX -= paddleSpeed * dt;
        if (paddleX < 0) paddleX = 0;
    }
}

// Speed and points
function increaseSpeed() {
    dx *= 1.1;
    dy *= 1.1;
}

// Increase speed every 5 seconds
setInterval(increaseSpeed, 5000);

// Increase multiplier every 10 seconds
setInterval(() => {
    pointsMultiplier += 1;
}, 10000);

// (Optional) Show multiplier on screen
function drawMultiplier() {
    ctx.font = `${Math.floor(canvas.height/18)}px Arial`;
    ctx.fillStyle = "#0095DD";
    const text = "x" + pointsMultiplier;
    const textWidth = ctx.measureText(text).width;
    ctx.fillText(text, (canvas.width - textWidth) / 2, 20);
}

// In your draw() function, after drawHighScore():
function draw(timestamp) {
    if (!lastTime) lastTime = timestamp;
    dt = (timestamp - lastTime) / 1000; // seconds
    lastTime = timestamp;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBall();
    drawPaddle();
    drawScore();
    drawHighScore();
    drawMultiplier(); // <-- add this line
    detectCollision();
    movePaddle(dt);

    x += dx * dt;
    y += dy * dt;

    requestAnimationFrame(draw);
}

// Recalculate sizes on resize
window.addEventListener('resize', () => {
    resizeCanvas();
});

requestAnimationFrame(draw);
</script>

</body>
</html>
